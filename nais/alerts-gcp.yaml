apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: syfomotebehov-alerts
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  groups:
    - name: syfomotebehov-alerts
      rules:
        - alert: SyfomotebehovUnavailable
          expr: |
            max by (k8s_cluster_name, namespace, deployment) (
              kube_deployment_status_replicas_available{
                k8s_cluster_name="prod",
                namespace="team-esyfo",
                deployment="syfomotebehov"
              }
            ) == 0
            and on (k8s_cluster_name, namespace, deployment)
            max by (k8s_cluster_name, namespace, deployment) (
              kube_deployment_spec_replicas{
                k8s_cluster_name="prod",
                namespace="team-esyfo",
                deployment="syfomotebehov"
              }
            ) > 0
          for: 5m
          annotations:
            summary: "syfomotebehov har ingen tilgjengelige replikaer i prod"
            consequence: "Møtebehov- og dialogmøteflyter kan være utilgjengelige."
            action: "Følg runbooken, bekreft rollout og bruker- eller requestpåvirkning. Dette er en urutet shadow-regel, ikke en aktiv pager."
            runbook_url: "https://navikt.github.io/team-esyfo/utvikling/observability/runbooks/syfomotebehov-tilgjengelighet"
            dashboard_url: "https://grafana.nav.cloud.nais.io/d/team-esyfo-kontrollrom/team-esyfo-kontrollrom?orgId=1&from=now-1h&to=now&timezone=browser&refresh=2m&var-service=syfomotebehov"
          labels:
            app: syfomotebehov
            namespace: team-esyfo
            severity: warning
            response: ticket
            pager_candidate: blocked
            alert_stage: shadow
            alert_type: custom
        - alert: SyfomotebehovHigh5xxRatio
          expr: |
            (
              100 *
              (
                sum by (service_name) (increase(traces_spanmetrics_calls_total{
                  service_namespace="team-esyfo",
                  service_name="syfomotebehov",
                  k8s_cluster_name="prod",
                  span_kind="SPAN_KIND_SERVER",
                  http_response_status_code=~"^5[0-9][0-9]$"
                }[15m]))
                or on (service_name)
                (
                  0 *
                  sum by (service_name) (increase(traces_spanmetrics_calls_total{
                    service_namespace="team-esyfo",
                    service_name="syfomotebehov",
                    k8s_cluster_name="prod",
                    span_kind="SPAN_KIND_SERVER",
                    http_response_status_code=~"^[1-5][0-9][0-9]$"
                  }[15m]))
                )
              )
              /
              sum by (service_name) (increase(traces_spanmetrics_calls_total{
                service_namespace="team-esyfo",
                service_name="syfomotebehov",
                k8s_cluster_name="prod",
                span_kind="SPAN_KIND_SERVER",
                http_response_status_code=~"^[1-5][0-9][0-9]$"
              }[15m]))
            ) > 2
            and on (service_name)
            sum by (service_name) (increase(traces_spanmetrics_calls_total{
              service_namespace="team-esyfo",
              service_name="syfomotebehov",
              k8s_cluster_name="prod",
              span_kind="SPAN_KIND_SERVER",
              http_response_status_code=~"^[1-5][0-9][0-9]$"
            }[15m])) >= 20
            and on (service_name)
            (
              sum by (service_name) (increase(traces_spanmetrics_calls_total{
                service_namespace="team-esyfo",
                service_name="syfomotebehov",
                k8s_cluster_name="prod",
                span_kind="SPAN_KIND_SERVER",
                http_response_status_code=~"^5[0-9][0-9]$"
              }[15m]))
              or on (service_name)
              (
                0 *
                sum by (service_name) (increase(traces_spanmetrics_calls_total{
                  service_namespace="team-esyfo",
                  service_name="syfomotebehov",
                  k8s_cluster_name="prod",
                  span_kind="SPAN_KIND_SERVER",
                  http_response_status_code=~"^[1-5][0-9][0-9]$"
                }[15m]))
              )
            ) >= 3
          for: 5m
          annotations:
            summary: "syfomotebehov har vedvarende høy 5xx-andel med reell trafikk"
            consequence: "Flere kall i møtebehov- eller dialogmøteflyten feiler teknisk."
            action: "Følg HTTP-runbooken, avgrens berørte operasjoner i APM og Kontrollrom, og sammenlign med siste rollout. Dette er en urutet shadow-regel."
            runbook_url: "https://navikt.github.io/team-esyfo/utvikling/observability/runbooks/http-runtime"
            dashboard_url: "https://grafana.nav.cloud.nais.io/d/team-esyfo-kontrollrom/team-esyfo-kontrollrom?orgId=1&from=now-1h&to=now&timezone=browser&refresh=2m&var-service=syfomotebehov"
          labels:
            app: syfomotebehov
            namespace: team-esyfo
            severity: warning
            response: ticket
            alert_stage: shadow
            alert_type: custom
        - alert: KAFKA ISOPPFOLGINGSTILFELLE-TOPIC CONSUMER LAG
          expr: kafka_consumergroup_group_topic_sum_lag{topic="teamsykefravr.isoppfolgingstilfelle-oppfolgingstilfelle-person", group="syfomotebehov-p-isoppfolgingstilfelle"} > 0
          for: 15m
          annotations:
            summary: "syfomotebehov har ukonsumerte Kafkameldinger på isoppfolgingstilfelle-topic"
            action: "Finn ut hvorfor syfomotebehov har stoppet å konsumere fra topic"
          labels:
            namespace: team-esyfo
            severity: warning

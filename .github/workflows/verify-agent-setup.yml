name: Verify agent setup

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  # Keep the existing protected-branch check identity during setup migration.
  verify-hovmester-sync:
    name: verify-hovmester-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository agent setup
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          retired_agents = {
              'auth', 'nais', 'observability', 'research', 'security-champion',
              'barista', 'hovmester', 'souschef', 'kokk', 'konditor',
              'inspektor-claude', 'inspektor-gpt', 'inspektør-claude',
              'inspektør-gpt', 'mattilsynet',
          }
          retired_skills = {
              'accessibility-review', 'api-design', 'auth-overview', 'brainstorm',
              'conventional-commit', 'create-a-skill', 'flyway-migration', 'grill-me',
              'issue-management', 'kafka-topic', 'klarsprak', 'kotlin-ktor',
              'kotlin-spring', 'nais-manifest', 'nav-architecture-review',
              'nav-troubleshoot', 'observability-setup', 'postgresql-review',
              'pull-request', 'readme-update', 'repo-sync', 'security-review', 'tdd',
          }
          problems = []
          for path in (Path('.github/.hovmester-manifest.json'), Path('.github/.copilot-kitchen-manifest.json')):
              if path.exists():
                  problems.append(f'Retired sync manifest: {path}')
          for root in ('.github/agents', '.claude/agents', '.opencode/agents'):
              for path in Path(root).glob('*.md'):
                  name = path.name.removesuffix('.md').removesuffix('.agent')
                  if name in retired_agents:
                      problems.append(f'Retired copied agent: {path}')
          for root in ('.github/skills', '.agents/skills', '.claude/skills', '.opencode/skills'):
              for path in Path(root).glob('*/SKILL.md'):
                  text = path.read_text(encoding='utf-8')
                  header = text.split('\n---', 1)[0] if text.startswith('---\n') else ''
                  match = re.search(r'^name:\s*([^\n]+)', header, re.MULTILINE)
                  name = match.group(1).strip().strip('\"\'') if match else None
                  if not name or name != path.parent.name:
                      problems.append(f'Skill name must match its directory: {path}')
                  if path.parent.name in retired_skills or (name and name.startswith('grillmester-')):
                      problems.append(f'Retired copied skill: {path}')
          for path in Path('.github/workflows').glob('*'):
              if path.suffix in ('.yml', '.yaml'):
                  text = path.read_text(encoding='utf-8')
                  if re.search(r'uses:\s*[\"\']?navikt/hovmester/', text, re.IGNORECASE):
                      problems.append(f'Retired sync caller: {path}')
          if problems:
              raise SystemExit('\n'.join(problems))
          print('Repository agent setup passed: local context retained, retired sync absent.')
          PYTHON

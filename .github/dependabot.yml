version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
      time: "14:30"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    ignore:
      # Temporary while investigating #811.
      - dependency-name: "io.netty:netty-handler"
        versions: ["4.2.20.Final"]
